services:
  seaweedfs:
    image: chrislusf/seaweedfs
    ports:
      - 127.0.0.1:9333:9333 # Master UI
      - 127.0.0.1:8888:8888 # Filer UI
      - 127.0.0.1:8333:8333 # S3 Endpoint
      - 127.0.0.1:23646:23646 # Admin UI
      - 127.0.0.1:9340:9340 # Volume Server
    command: 'mini -dir=/data'
    volumes:
      - ./data:/data
    env_file: .env