# ─────────────────────────────────────────────
#  Spark → SeaweedFS (S3A) configuration
#  Coloca este archivo en la raíz del proyecto,
#  al lado del docker-compose.yaml
# ─────────────────────────────────────────────

# S3A → SeaweedFS
spark.hadoop.fs.s3a.endpoint=http://seaweedfs:8333
spark.hadoop.fs.s3a.access.key=admin
spark.hadoop.fs.s3a.secret.key=admin
spark.hadoop.fs.s3a.path.style.access=true
spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.connection.ssl.enabled=false

# Evita que Spark intente obtener credenciales de AWS real
spark.hadoop.fs.s3a.aws.credentials.provider=org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider


# Rendimiento básico
spark.sql.adaptive.enabled=true
spark.sql.parquet.compression.codec=snappy

# Delta Lake (compat: Spark 3.4.x ↔ Delta 2.4.x).
# - jars.packages descarga delta-core en runtime y lo distribuye a executors vía Ivy.
# - extensions/catalog activan SQL y catálogo Delta como motor por defecto, de modo que
#   read/write con format("delta") funcionan sin más boilerplate.
spark.jars.packages=io.delta:delta-core_2.12:2.4.0
spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog