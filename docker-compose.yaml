# This config is used by airflow components and has been obtained from
# https://github.com/apache/airflow/blob/main/airflow-core/docs/howto/docker-compose/docker-compose.yaml#
x-airflow-common:
  &airflow-common
  # In order to add custom dependencies or upgrade provider distributions you can use your extended image.
  # Comment the image line, place your Dockerfile in the directory where you placed the docker-compose.yaml
  # and uncomment the "build" line below, Then run `docker-compose build` to build the images.
  # image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.1.2}
  build:
    context: .
    dockerfile: ./docker/airflow/Dockerfile
  env_file:
    - ${ENV_FILE_PATH:-.env}
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    # yamllint disable rule:line-length
    # Use simple http server on scheduler for health checks
    # See https://airflow.apache.org/docs/apache-airflow/stable/administration-and-deployment/logging-monitoring/check-health.html#scheduler-health-check-server
    # yamllint enable rule:line-length
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # WARNING: Use _PIP_ADDITIONAL_REQUIREMENTS option ONLY for a quick checks
    # for other purpose (development, test and especially production usage) build/extend Airflow image.
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
    # The following line can be used to set a custom config file, stored in the local config folder
    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
    # Auto-creates Airflow Connection "spark_bdm" pointing at the standalone Spark master.
    # Required by dags/silver/trusted_zone_dag.py and dags/gold/exploitation_zone_dag.py
    # (both use SparkSubmitOperator with conn_id="spark_bdm").
    AIRFLOW_CONN_SPARK_BDM: 'spark://spark-master:7077'
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
    - ${AIRFLOW_PROJ_DIR:-.}/trusted-zone:/opt/spark/work-dir/trusted-zone
    - ${AIRFLOW_PROJ_DIR:-.}/exploitation-zone:/opt/spark/work-dir/exploitation-zone
    - ${AIRFLOW_PROJ_DIR:-.}/spark_client:/opt/spark/work-dir/spark_client
  networks:
    - bdm-network
    - default
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy




services:
  # ----------------------------------------- STORAGE ----------------------------------------- #

  seaweedfs:
    image: chrislusf/seaweedfs
    ports:
      - ${SEAWEEDFS_MASTER_UI_ENDPOINT}:9333 # Master UI
      - ${SEAWEEDFS_FILER_UI_ENDPOINT}:8888 # Filer UI
      - ${SEAWEEDFS_S3_ENDPOINT}:8333 # S3 Endpoint
      - ${SEAWEEDFS_ADMIN_UI_ENDPOINT}:23646 # Admin UI
      - ${SEAWEEDFS_VOLUME_SERVER_UI_ENDPOINT}:9340 # Volume Server
    command: 'mini -dir=/data'
    volumes:
      - seaweedfs-data:/data
    env_file: .env
    networks:
      - bdm-network
      - default

  # ----------------------------------------- KAFKA ----------------------------------------- #

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    # networks:
    #   - broker-kafka
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    # networks:
    #   - broker-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # kafdrop:
  #   image: obsidiandynamics/kafdrop:latest
  #   container_name: kafdrop
  #   # networks:
  #   #   - broker-kafka
  #   depends_on:
  #     - kafka
  #   ports:
  #     - "9002:9000"
  #   environment:
  #     KAFKA_BROKERCONNECT: "kafka:29092"
  #     JVM_OPTS: "-Xms32M -Xmx128M"

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    # networks:
    #   - broker-kafka
    ports:
      - 8081:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: "Local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
      # "Laptop-friendly resource limits"
      # Cap the JVM heap; the UI is read-only and needs very little memory.
      JAVA_OPTS: '-Xmx192m -Xms128m'
    depends_on:
      - kafka
    #     condition: service_healthy
        
    restart: unless-stopped


  spark-master:
    build:
      context: .
      dockerfile: Dockerfile
    image: bdm-spark:3.3.4
    container_name: spark-master
    environment:
      - SPARK_NO_DAEMONIZE=true
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "8082:8080"
      - "8890:8888"
    volumes:
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      # Mounted so `docker compose exec spark-master spark-submit ...` can find
      # the streaming app sources when invoked manually.
      - ./spark_streaming:/opt/spark/work-dir/spark_streaming
    networks:
      - bdm-network
    depends_on:
      - seaweedfs
    restart: unless-stopped

  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: bdm-spark:3.3.4
    container_name: spark-worker
    environment:
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
      - SPARK_NO_DAEMONIZE=true
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    volumes:
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./notebooks:/opt/spark/work-dir/notebooks
      - ./trusted-zone:/opt/spark/work-dir/trusted-zone
      - ./exploitation-zone:/opt/spark/work-dir/exploitation-zone
      - ./spark_client:/opt/spark/work-dir/spark_client
      # Required by --deploy-mode cluster: the driver lands on the worker
      # and needs the streaming module on its local filesystem.
      - ./spark_streaming:/opt/spark/work-dir/spark_streaming
    networks:
      - bdm-network
    depends_on:
      - spark-master
    restart: unless-stopped

  # Long-running Spark Structured Streaming job that consumes every Kafka
  # topic produced upstream and appends Parquet under
  # s3a://landing-zone/streaming/{topic}/. Opt-in via the `streaming` profile:
  #
  #     docker compose --profile streaming up -d spark-streaming
  #
  # The container reuses the bdm-spark image so the S3A and AWS SDK jars are
  # already baked in. The Kafka jar is pulled at runtime via --packages.
  spark-streaming:
    image: bdm-spark:3.3.4
    container_name: spark-streaming
    profiles:
      - streaming
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - S3A_ENDPOINT=http://seaweedfs:8333
      - S3A_ACCESS_KEY=admin
      - S3A_SECRET_KEY=admin
      - LANDING_BUCKET=landing-zone
    volumes:
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./spark_streaming:/opt/spark/work-dir/spark_streaming
    working_dir: /opt/spark/work-dir
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --deploy-mode client
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.4.1
      --conf spark.jars.ivy=/tmp/.ivy2
      --conf spark.driver.memory=1g
      --conf spark.executor.memory=1g
      /opt/spark/work-dir/spark_streaming/streaming_processor.py
    networks:
      - bdm-network
    depends_on:
      - spark-master
      - spark-worker
      - kafka
      - seaweedfs
    restart: unless-stopped

  # ----------------------------------------- CHROMA + ML / DASHBOARD ----------------------------------------- #

  chromadb:
    image: chromadb/chroma:0.5.5
    container_name: chromadb
    ports:
      - "8000:8000"
    environment:
      - ANONYMIZED_TELEMETRY=false
      - IS_PERSISTENT=TRUE
    volumes:
      - chroma-data:/chroma/chroma
    networks:
      - bdm-network
    restart: unless-stopped

  dashboard:
    build:
      context: ./presentation-layer
      dockerfile: Dockerfile
    image: bdm-dashboard:latest
    container_name: dashboard
    ports:
      - "8501:8501"
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - S3_ENDPOINT=http://seaweedfs:8333
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=admin
      - TRUSTED_BUCKET=trusted-zone
      - EXPLOITATION_BUCKET=exploitation-zone
      - DATA_PREFIX=
      # Prefijos Parquet en exploitation para pestañas ML (opcional; valores por defecto en app.py)
      - ACCIDENTS_GU_ML_PREFIX=ajuntament_bcn/accidents_gu/
      # Salida del join Spark en exploitation_zone (accidents + features trànsit)
      - BCN_ML_READY_PREFIX=ajuntament_bcn/ml_ready_accidents_traffic/
      - AEMET_ML_PREFIX=aemet/
      - HF_RAIN_ML_PREFIX=huggingface/kanishka089/
      - TOMTOM_ML_PREFIX=TOMTOM/
      - SCT_TRAFFIC_INCIDENTS_PREFIX=sct/traffic_incidents/
      # Parquet de tweets RSS/Nitter en exploitation (misma jerarquía que en trusted)
      - TRANSIT_POSTS_PREFIX=transit_posts/
      - KAGGLE_ML_PREFIX=
    volumes:
      - ./presentation-layer:/app
      - ./trusted-zone:/trusted-zone:ro
      - ./exploitation-zone:/exploitation-zone:ro
    networks:
      - bdm-network
    depends_on:
      - chromadb
      - seaweedfs
    restart: unless-stopped

  # ----------------------------------------- AIRFLOW ----------------------------------------- #

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  redis:
    # Redis is limited to 7.2-bookworm due to licencing change
    # https://redis.io/blog/redis-adopts-dual-source-available-licensing/
    image: redis:7.2-bookworm
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    healthcheck:
      # yamllint disable rule:line-length
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      <<: *airflow-common-env
      # Required to handle warm shutdown of the celery workers properly
      # See https://airflow.apache.org/docs/docker-stack/entrypoint.html#signal-propagation
      DUMB_INIT_SETSID: "0"

      # Custom variables needed by the dags
      AIRFLOW_VAR_AEMET_API_KEY: ${AEMET_API_KEY}
      AIRFLOW_VAR_AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AIRFLOW_VAR_AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AIRFLOW_VAR_S3_ENDPOINT: ${S3_ENDPOINT}
      AIRFLOW_VAR_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-apiserver:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    # yamllint disable rule:line-length
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "If you are on Linux, you SHOULD follow the instructions below to set "
          echo "AIRFLOW_UID environment variable, otherwise files will be owned by root."
          echo "For other operating systems you can get rid of the warning with manually created .env file:"
          echo "    See: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#setting-the-right-airflow-user"
          echo
          export AIRFLOW_UID=$$(id -u)
        fi
        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')
        warning_resources="false"
        if (( mem_available < 4000 )) ; then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
          echo "At least 4GB of memory required. You have $$(numfmt --to iec $$((mem_available * one_meg)))"
          echo
          warning_resources="true"
        fi
        if (( cpus_available < 2 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\e[0m"
          echo "At least 2 CPUs recommended. You have $${cpus_available}"
          echo
          warning_resources="true"
        fi
        if (( disk_available < one_meg * 10 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\e[0m"
          echo "At least 10 GBs recommended. You have $$(numfmt --to iec $$((disk_available * 1024 )))"
          echo
          warning_resources="true"
        fi
        if [[ $${warning_resources} == "true" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: You have not enough resources to run Airflow (see above)!\e[0m"
          echo "Please follow the instructions to increase amount of resources available:"
          echo "   https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#before-you-begin"
          echo
        fi
        echo
        echo "Creating missing opt dirs if missing:"
        echo
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Airflow version:"
        /entrypoint airflow version
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Running airflow config list to create default config file if missing."
        echo
        /entrypoint airflow config list >/dev/null
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Change ownership of files in /opt/airflow to ${AIRFLOW_UID}:0"
        echo
        chown -R "${AIRFLOW_UID}:0" /opt/airflow/
        echo
        echo "Change ownership of files in shared volumes to ${AIRFLOW_UID}:0"
        echo
        chown -v -R "${AIRFLOW_UID}:0" /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}

    # yamllint enable rule:line-length
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"

  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    # Workaround for entrypoint issue. See: https://github.com/apache/airflow/issues/16252
    command:
      - bash
      - -c
      - airflow
    depends_on:
      <<: *airflow-common-depends-on

  # You can enable flower by adding "--profile flower" option e.g. docker-compose --profile flower up
  # or by explicitly targeted on the command line e.g. docker-compose up flower.
  # See: https://docs.docker.com/compose/profiles/
  flower:
    <<: *airflow-common
    command: celery flower
    profiles:
      - flower
    ports:
      - "5555:5555"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # ----------------------------------------- IOT SENSORS ----------------------------------------- #

  parking-sensor:
    image: python:3.11-slim
    container_name: parking-sensor
    restart: always
    volumes:
      - ./src/synthetic_data:/app
    working_dir: /app
    command: >
      bash -c "pip install kafka-python-ng && 
               python parking_iot_sensor.py --brokers kafka:29092"
    networks:
      - default
      # - broker-kafka
    depends_on:
      kafka:
        condition: service_started

  sensor-bcn:
    image: python:3.11-slim
    container_name: sensor-bcn
    restart: always
    volumes:
      - ./src/synthetic_data:/app
    working_dir: /app
    command: >
      bash -c "pip install kafka-python-ng && 
               python sensor_bcn.py --brokers kafka:29092"
    networks:
      - default
      # - broker-kafka
    depends_on:
      kafka:
        condition: service_started

  jupyter:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: jupyter
      ports:
        - "8889:8888"
      environment:
        - SPARK_NO_DAEMONIZE=true
        - CHROMA_HOST=chromadb
        - CHROMA_PORT=8000
      command: >
        jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser 
        --allow-root --NotebookApp.token='' --NotebookApp.password=''
      volumes:
        - ./notebooks:/opt/spark/work-dir/notebooks
        - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
        - ./trusted-zone:/opt/spark/work-dir/trusted-zone
        - ./exploitation-zone:/opt/spark/work-dir/exploitation-zone
        - ./spark_client:/opt/spark/work-dir/spark_client
        - ./presentation-layer:/opt/spark/work-dir/presentation-layer
      networks:
        - bdm-network
      depends_on:
        - seaweedfs
        - chromadb
      restart: unless-stopped

volumes:
  seaweedfs-data:
  postgres-db-volume:
  chroma-data:

networks:
  bdm-network:
    driver: bridge
