name: bdm
services:
  minio:
    image: quay.io/minio/minio
    ports:
      - 9000:9000 # MinIO Api
      - 9001:9001 # MinIO Console
    command: server /data --console-address=":9001"
    environment:
      MINIO_ROOT_USER: ${ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${SECRET_ACCESS_KEY}
    volumes:
      - minio-data:/data

volumes:
  minio-data:
